    .review-poster-link {
      position: absolute;
      top: 5.8%;
      left: 68.8%;
      width: 20.5%;
      height: 7.2%;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      z-index: 2;
      background: rgba(0,0,0,0);
    }

    .review-poster-link:focus-visible {
      outline: 2px solid #c98382;
      outline-offset: 4px;
    }

    @media (max-width: 768px) {
      .review-poster-page {
        padding: 0 0 56px;
      }

      .review-poster-link {
        top: 5.8%;
        left: 68.6%;
        width: 20.8%;
        height: 7.4%;
      }
    }

    @media (max-width: 560px) {
      .review-poster-wrap {
        padding: 0 18px 44px;
      }

      .review-poster-image {
        border-radius: 20px;
      }

      .review-poster-link {
