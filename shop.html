<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>매장 소개 | 쵸코네일 삼송점</title>
  <link rel="stylesheet" href="category-style.css?v=shop-source-hero-20260522-fix2">
  <style>
    /* 매장 소개 페이지 전용: 리뷰 페이지처럼 상단 타이틀은 HTML 소스로, 이미지는 아래에 배치 */
    main.shop-poster-page {
      width: 100%;
      display: block !important;
      padding: 0 0 80px;
      background: #fff8f5;
    }

    main.shop-poster-page .page-hero {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 72px 24px 28px;
      box-sizing: border-box;
      text-align: center;
      display: block !important;
    }

    .shop-poster-wrap {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px 60px;
      box-sizing: border-box;
      display: block !important;
    }

    .shop-poster-box {
      position: relative;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: block !important;
    }

    .shop-poster-image {
      display: block;
      width: 100%;
      max-width: 1180px;
      height: auto;
      margin: 0 auto;
      border-radius: 28px;
      box-shadow: 0 18px 42px rgba(107, 72, 64, 0.08);
      border: 1px solid #f0ddd7;
      background: #fff8f5;
    }

    @media (max-width: 768px) {
      main.shop-poster-page {
        padding: 0 0 56px;
      }

      main.shop-poster-page .page-hero {
        padding: 52px 20px 24px;
      }
    }

    @media (max-width: 560px) {
      main.shop-poster-page .page-hero {
        padding: 42px 18px 22px;
      }

      .shop-poster-wrap {
        padding: 0 18px 44px;
      }

      .shop-poster-image {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="쵸코네일 삼송점 홈으로 이동">
      <span class="brand-title">쵸코네일 삼송점</span>
      <span class="brand-subtitle">Premium Nail Care</span>
    </a>
    <nav class="category-nav" aria-label="카테고리 메뉴">
      <a href="index.html">홈</a>
      <a href="gel-nail.html">네일</a>
      <a href="pedi.html">패디</a>
      <a href="monthly-art.html">이달의 아트</a>
      <a href="care.html">케어</a>

      <a href="shop.html" class="active">매장 소개</a>

    <a class="reservation-link" href="https://map.naver.com/p/entry/place/1964980021" target="_blank" rel="noopener" aria-label="네이버 예약">
      네이버 예약
    </a>
  </header>

  <main class="shop-poster-page">
    <section class="page-hero">
      <p class="eyebrow">쵸코네일 삼송점</p>
      <h1>매장 소개</h1>
      <p>편안하고 깔끔한 분위기의 초코네일 삼송점 공간입니다.</p>
    </section>

    <section class="shop-poster-wrap" aria-label="매장 소개 및 오시는 길 안내 이미지">
      <div class="shop-poster-box">
        <img
          src="images/shop_intro_poster.png"
          alt="초코네일 삼송점 매장 소개 및 오시는 길 안내"
          class="shop-poster-image"
        >
      </div>
    </section>
  </main>

</body>
