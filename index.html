<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쵸코네일 삼송점</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero" aria-label="쵸코네일 삼송점 랜딩페이지">
    <div class="hero-frame">
      <img src="images/final-design.png" alt="쵸코네일 삼송점 메인 랜딩 이미지">

      <div class="hero-hotspots" aria-label="쵸코네일 삼송점 링크">
        <!-- 상단 메뉴 -->
        <a class="hero-hotspot menu-home" href="index.html" aria-label="홈으로 이동"></a>
        <a class="hero-hotspot menu-nail" href="gel-nail.html" aria-label="젤네일 페이지로 이동"></a>
        <a class="hero-hotspot menu-pedi" href="pedi.html" aria-label="패디 페이지로 이동"></a>
        <a class="hero-hotspot menu-monthly" href="monthly-art.html" aria-label="이달의 아트 페이지로 이동"></a>
        <a class="hero-hotspot menu-care" href="care.html" aria-label="케어 페이지로 이동"></a>
        <a class="hero-hotspot menu-review" href="gallery.html" aria-label="리뷰 페이지로 이동"></a>
        <a class="hero-hotspot menu-shop" href="shop.html" aria-label="매장 소개 페이지로 이동"></a>

        <!-- 우측 상단 네이버 예약 -->
        <a
          class="hero-hotspot naver-top"
          href="https://map.naver.com/p/entry/place/1964980021"
          target="_blank"
          rel="noopener"
          aria-label="네이버 예약하기"
        ></a>

        <!-- 메인 버튼 -->
        <a
          class="hero-hotspot naver-main"
          href="https://map.naver.com/p/entry/place/1964980021"
          target="_blank"
          rel="noopener"
          aria-label="네이버 예약하기"
        ></a>
        <a
          class="hero-hotspot kakao"
          href="https://open.kakao.com/o/sCU8pFob"
          target="_blank"
          rel="noopener"
          aria-label="카카오톡 상담하기"
        ></a>
        <a
          class="hero-hotspot blog"
          href="https://blog.naver.com/boong27"
          target="_blank"
          rel="noopener"
          aria-label="블로그 보기"
        ></a>

        <!-- 하단 서비스 버튼 -->
        <a class="hero-hotspot card-nail" href="gel-nail.html" aria-label="젤네일 페이지로 이동"></a>
        <a class="hero-hotspot card-monthly" href="monthly-art.html" aria-label="이달의 아트 페이지로 이동"></a>
        <a class="hero-hotspot card-pedi" href="pedi.html" aria-label="패디 페이지로 이동"></a>
        <a class="hero-hotspot card-care" href="care.html" aria-label="문제성 손톱 발톱 케어 페이지로 이동"></a>
      </div>
    </div>
  </main>
</body>
</html>
