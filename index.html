<!DOCTYPE html>

        <a
          class="hero-hotspot naver-top"
          href="https://map.naver.com/p/entry/place/1964980021"
          target="_blank"
          rel="noopener"
          aria-label="네이버 예약하기"
        ></a>

        <!-- 메인 버튼 -->
        <a
          class="hero-hotspot naver-main"
          href="https://map.naver.com/p/entry/place/1964980021"

        <a

          target="_blank"

      <span>1인샵</span>
      <span>원장 직접 시술</span>
      <span>주차 가능</span>
      <span>문제성 손·발톱 케어</span>

    <nav class="mobile-service-menu" aria-label="서비스 메뉴">
      <a href="gel-nail.html">네일</a>
      <a href="monthly-art.html">이달의 아트</a>
      <a href="pedi.html">패디</a>
      <a href="care.html">케어</a>
